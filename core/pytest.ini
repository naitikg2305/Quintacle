[pytest]
# Layout (2026-11-11, owner):
#   tests/claude/existing/            code tests, models FAKED (fast; the default run)
#   tests/claude/local/               REAL local models (Ollama), my inputs
#   tests/claude/subscription_or_api/ REAL Claude via the Max subscription (API fallback blocked)
#   tests/user/                       the owner's tests, built with him from his testing folder
# `pytest` alone runs tests/claude/existing. Run each live suite in its own call:
#   .venv/bin/python -m pytest tests/claude/local -q
#   .venv/bin/python -m pytest tests/claude/subscription_or_api -q
testpaths = tests/claude/existing
pythonpath = .
